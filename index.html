<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Telnyx Masovni Pozivi - Lang Love</title>
    <!-- Učitavanje Supabase JavaScript biblioteke -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .container { background: white; padding: 25px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 450px; text-align: left; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        button { padding: 10px 15px; font-size: 14px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; margin-left: 5px; }
        .btn-danger:hover { background-color: #c82333; }
        h2 { text-align: center; color: #333; }
        ul { list-style-type: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #eee; margin-top: 15px; border-radius: 4px; }
        li { padding: 8px 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        li:last-child { border-bottom: none; }
        .status-ok { color: green; font-weight: bold; }
        .status-err { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Telnyx Upravljanje Brojevima</h2>
    <p>Unesi više brojeva (svaki u novi red):</p>
    <textarea id="listaBrojeva" placeholder="+38761111111&#10;+38762222222"></textarea>
    <br>
    <button onclick="sacuvajBrojeve()">Sačuvaj u memoriju</button>
    <button onclick="ocistiMemoriju()" class="btn-danger">Obriši sve</button>

    <h3>Sačuvani brojevi:</h3>
    <ul id="prikazBrojeva"></ul>
</div>

<script>
    // 1. Ovdje unesi svoje Supabase podatke
    const SUPABASE_URL = 'https://tvoj-supabase-url.supabase.co';
    const SUPABASE_ANON_KEY = 'tvoj-anon-kljuc';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Učitaj brojeve iz LocalStorage-a pri pokretanju stranice
    window.onload = prikaziBrojeve;

    function sacuvajBrojeve() {
        const tekst = document.getElementById('listaBrojeva').value;
        if (!tekst.trim()) {
            alert('Molimo unesite barem jedan broj!');
            return;
        }

        // Razdvoji po novom redu, očisti praznine i izbaci prazne linije
        let noviBrojevi = tekst.split('\n').map(b => b.trim()).filter(b => b.length > 0);
        
        // Uzmi postojeće iz LocalStorage-a
        let postojeci = JSON.parse(localStorage.getItem('telnyx_saved_numbers')) || [];
        
        // Spoji i ukloni duplikate
        let kombinovano = [...new Set([...postojeci, ...noviBrojevi])];
        
        localStorage.setItem('telnyx_saved_numbers', JSON.stringify(kombinovano));
        document.getElementById('listaBrojeva').value = '';
        prikaziBrojeve();
        alert('Brojevi uspješno sačuvani u memoriju!');
    }

    function prikaziBrojeve() {
        const lista = document.getElementById('prikazBrojeva');
        lista.innerHTML = '';
        
        let brojevi = JSON.parse(localStorage.getItem('telnyx_saved_numbers')) || [];
        
        if (brojevi.length === 0) {
            lista.innerHTML = '<li style="text-align:center; color:#888;">Nema sačuvanih brojeva</li>';
            return;
        }

        brojevi.forEach((broj, index) => {
            let li = document.createElement('li');
            li.innerHTML = `
                <span>${broj}</span>
                <div>
                    <button onclick="pozoviBroj('${broj}', this)">Pozovi</button>
                    <button onclick="obrisiJedan(${index})" class="btn-danger">X</button>
                </div>
            `;
            lista.appendChild(li);
        });
    }

    async function pozoviBroj(telefon, btnElement) {
        btnElement.innerText = 'Zove...';
        btnElement.disabled = true;

        try {
            const { data, error } = await supabaseClient.functions.invoke('TELNYX_POZIVI', {
                body: { phone_number: telefon }
            });

            if (error) throw error;

            btnElement.innerText = 'Pozvano!';
            btnElement.style.backgroundColor = 'green';
        } catch (err) {
            btnElement.innerText = 'Greška';
            btnElement.style.backgroundColor = 'red';
            console.error(err);
        }
    }

    function obrisiJedan(index) {
        let brojevi = JSON.parse(localStorage.getItem('telnyx_saved_numbers')) || [];
        brojevi.splice(index, 1);
        localStorage.setItem('telnyx_saved_numbers', JSON.stringify(brojevi));
        prikaziBrojeve();
    }

    function ocistiMemoriju() {
        if (confirm('Da li ste sigurni da želite obrisati sve sačuvane brojeve?')) {
            localStorage.removeItem('telnyx_saved_numbers');
            prikaziBrojeve();
        }
    }
</script>

</body>
</html>
