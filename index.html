<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Telnyx Masovni Pozivi - Lang Love</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .container { background: white; padding: 25px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 620px; text-align: left; }
        textarea { width: 100%; height: 120px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        button { padding: 8px 12px; font-size: 13px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; margin-right: 3px; }
        button:hover { background-color: #0056b3; }
        .btn-transcript { background-color: #17a2b8; }
        .btn-transcript:hover { background-color: #138496; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        h2 { text-align: center; color: #333; }
        ul { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #eee; margin-top: 15px; border-radius: 4px; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        li:last-child { border-bottom: none; }
        .firma-col { font-weight: bold; color: #444; width: 30%; }
        .broj-col { color: #007bff; width: 25%; }
        .info-tekst { font-size: 11px; color: #555; margin-top: 3px; }
        .status-bar { background: #e2e8f0; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 12px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Telnyx Upravljanje Brojevima</h2>
    
    <div class="status-bar">
        <span>🔄 Auto-praćenje baze (svakih 5s): <strong id="autoStatus" style="color: #28a745;">Aktivno</strong></span>
        <span id="zadnjaProvjera" style="color: #666;">Čekanje...</span>
    </div>

    <p>Unesi više unosa odjednom (Format: <strong>Naziv firme, Broj</strong> - svaki u novi red):</p>
    <textarea id="listaBrojeva" placeholder="B&B Woodworking, 5551111111&#10;Apex Roofing, +15552222222"></textarea>
    <br>
    <button onclick="sacuvajPodatke()">Sačuvaj sve u memoriju</button>
    <button onclick="ocistiMemoriju()" class="btn-danger">Obriši sve</button>

    <h3>Sačuvani unosi:</h3>
    <ul id="prikazPodataka"></ul>
</div>

<script>
    const SUPABASE_URL = 'https://uduwpvdjmanrgpumdrfh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmFkam1hbnJncHVtZHJmaCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg0ODExMDg0LCJleHAiOjIxMDAzODcwODR9.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ';
    const SUPABASE_FUNKCIJA_URL = `${SUPABASE_URL}/functions/v1/TELNYX_POZIVI`;

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Varijabla koja sprječava pokretanje novog poziva dok je prethodni u toku
    let pozivUToeku = false;

    window.onload = function() {
        prikaziPodatke();
        setInterval(provjeriBazuZaPozive, 5000);
    };

    function formatirajUSBroj(br) {
        br = br.replace(/[\s\-\.\(\)]/g, '');
        if (br === "") return "";

        if (br.startsWith('00')) {
            br = '+' + br.substring(2);
        } else if (br.length === 10 && !br.startsWith('+')) {
            br = '+1' + br;
        } else if (br.length === 11 && br.startsWith('1')) {
            br = '+' + br;
        } else if (!br.startsWith('+') && br.length > 6) {
            br = '+' + br;
        }
        return br;
    }

    function sacuvajPodatke() {
        const tekst = document.getElementById('listaBrojeva').value;
        if (!tekst.trim()) {
            alert('Molimo unesite podatke!');
            return;
        }

        let noveStavke = [];
        let linije = tekst.split('\n');

        for (let linija of linije) {
            if (!linija.trim()) continue;

            let dijelovi = linija.split(/,|\t/);
            
            if (dijelovi.length >= 2) {
                let firma = dijelovi[0].trim();
                let siroviBroj = dijelovi.slice(1).join('').trim();
                let broj = formatirajUSBroj(siroviBroj);

                if (firma && broj) {
                    noveStavke.push({ 
                        firma: firma, 
                        broj: broj,
                        status: 'Nije zvan',
                        vrijeme: ''
                    });
                }
            }
        }

        if (noveStavke.length === 0) {
            alert('Neispravan format! Provjerite jeste li odvojili naziv firme i broj zarezom.');
            return;
        }

        let postojeci = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        let kombinovano = [...postojeci];
        
        noveStavke.forEach(novi => {
            if (!kombinovano.some(p => p.broj === novi.broj)) {
                kombinovano.push(novi);
            }
        });

        localStorage.setItem('telnyx_saved_entries', JSON.stringify(kombinovano));
        document.getElementById('listaBrojeva').value = '';
        prikaziPodatke();
        alert('Uspješno sačuvano unosa!');
    }

    function prikaziPodatke() {
        const lista = document.getElementById('prikazPodataka');
        lista.innerHTML = '';
        
        let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        
        if (unosi.length === 0) {
            lista.innerHTML = '<li style="text-align:center; color:#888; display:block;">Nema sačuvanih unosa</li>';
            return;
        }

        unosi.forEach((unos, index) => {
            let li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <span class="firma-col"><strong>${unos.firma}</strong></span>
                    <span class="broj-col">${unos.broj}</span>
                    <div class="info-tekst">Status: ${unos.status} ${unos.vrijeme ? '(' + unos.vrijeme + ')' : ''}</div>
                </div>
                <div>
                    <button onclick="pozoviBroj('${unos.broj}', ${index}, this)">Pozovi</button>
                    <button class="btn-transcript" onclick="otvoriTranscript('${unos.broj}')">Transcript</button>
                    <button onclick="obrisiJedan(${index})" class="btn-danger">X</button>
                </div>
            `;
            lista.appendChild(li);
        });
    }

    async function izvrsiTelnyxPoziv(telefon) {
        const response = await fetch(SUPABASE_FUNKCIJA_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ to: telefon })
        });

        if (!response.ok) {
            throw new Error('Server je vratio grešku: ' + response.status);
        }

        return await response.json();
    }

    async function pozoviBroj(telefon, index, btnElement) {
        if (btnElement) {
            btnElement.innerText = 'Zove...';
            btnElement.disabled = true;
        }

        try {
            await izvrsiTelnyxPoziv(telefon);

            let datumVrijeme = new Date().toLocaleString('hr-HR');
            let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
            if (unosi[index]) {
                unosi[index].status = 'Pozvan';
                unosi[index].vrijeme = datumVrijeme;
                localStorage.setItem('telnyx_saved_entries', JSON.stringify(unosi));
            }

            prikaziPodatke();
        } catch (err) {
            alert('Greška pri pozivanju: ' + err.message);
            if (btnElement) {
                btnElement.innerText = 'Pozovi';
                btnElement.disabled = false;
            }
            console.error(err);
        }
    }

    // KONTinuirano praćenje baze: obrađuje jedan po jedan red dok ima stavki sa statusom 'Ceka'
    async function provjeriBazuZaPozive() {
        let vrijemeElem = document.getElementById('zadnjaProvjera');
        vrijemeElem.innerText = 'Provjera: ' + new Date().toLocaleTimeString();

        // Ako je trenutno u toku pozivanje, preskoči ovaj krug provjere da se ne sudaraju
        if (pozivUToeku) return;

        try {
            const { data, error } = await supabaseClient
                .from('RAZGOVORI_TELNYX')
                .select('*')
                .eq('STATUS_POZIVA', 'Ceka')
                .limit(1);

            if (error) {
                console.warn('Greška pri čitanju baze:', error.message);
                return;
            }

            if (data && data.length > 0) {
                let red = data[0];
                let telefonZaPoziv = red.BROJ || red.TELEFON || red.TO;

                if (telefonZaPoziv) {
                    pozivUToeku = true; // Zaključaj dok se ovaj poziv ne završi

                    // 1. Označi u bazi da je pozivanje u toku
                    await supabaseClient
                        .from('RAZGOVORI_TELNYX')
                        .update({ STATUS_POZIVA: 'U_toku' })
                        .eq('id', red.id);

                    try {
                        // 2. Izvrši Telnyx poziv
                        await izvrsiTelnyxPoziv(telefonZaPoziv);

                        // 3. Kad je uspješno završen, upisuje se zadnji status 'Pozvano'
                        let datumVrijeme = new Date().toLocaleString('hr-HR');
                        await supabaseClient
                            .from('RAZGOVORI_TELNYX')
                            .update({ 
                                STATUS_POZIVA: 'Pozvano',
                                VRIJEME_POZIVA: datumVrijeme 
                            })
                            .eq('id', red.id);

                        console.log('Uspješno pozvan broj:', telefonZaPoziv);
                    } catch (callErr) {
                        // Ako pukne poziv, zabilježi status greške da ostane vidljiv
                        await supabaseClient
                            .from('RAZGOVORI_TELNYX')
                            .update({ STATUS_POZIVA: 'Greška pri pozivu' })
                            .eq('id', red.id);
                        console.error('Greška pri automatskom pozivu:', callErr);
                    } finally {
                        pozivUToeku = false; // Otključaj za sljedeći broj u redu
                    }
                }
            }
        } catch (e) {
            console.error('Greška u petlji praćenja:', e);
            pozivUToeku = false;
        }
    }

    function otvoriTranscript(telefon) {
        window.location.href = `transcript.html?phone=${encodeURIComponent(telefon)}`;
    }

    function obrisiJedan(index) {
        let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        unosi.splice(index, 1);
        localStorage.setItem('telnyx_saved_entries', JSON.stringify(unosi));
        prikaziPodatke();
    }

    function ocistiMemoriju() {
        if (confirm('Da li ste sigurni da želite obrisati sve sačuvane podatke?')) {
            localStorage.removeItem('telnyx_saved_entries');
            prikaziPodatke();
        }
    }
</script>

</body>
</html>
