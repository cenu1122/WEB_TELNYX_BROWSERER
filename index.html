    .modal {

  </style>

<body>

<script>

  /* ============================================================
     KONFIGURACIJA
     ============================================================ */

  const SUPABASE_URL =
    "https://lvvidixbdtdjfwxxxqzr.supabase.co";

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmlkaXhiZHRkamZ3eHh4cXpyIiwiaWF0IjoxNzc1NTY4MzI4LCJleHAiOjIwOTExNDQzMjh9.HE3-5jMrxZ7suTR0lebcfZB-9WqslwExarGoxDYMA_s";

  const EDGE_FUNCTION_URL =
    "https://lvvidixbdtdjfwxxxqzr.supabase.co/functions/v1/telnyx_špopozivic";

  const TELNYX_TABLE =
    "TELNYX_POZIVI";

  const RAZGOVORI_TABLE =
    "RAZGOVORI_TELNYX";

  const RAZGOVORI_AUDIO_COLUMN =
    "AUDIO_URL";


  /* ============================================================
     STANJE APLIKACIJE
     ============================================================ */

  let sviPozivi = [];

  let aktivniPoziv = null;

  let pollingTimer = null;

  let autoRefreshTimer = null;


  /* ============================================================
     SUPABASE REST
     ============================================================ */

  async function supabaseFetch(path, options = {}) {

    const response = await fetch(
      SUPABASE_URL + path,
      {
        ...options,

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    const text = await response.text();

    let data = null;

    try {
      data = text ? JSON.parse(text) : null;
    }

    catch {
      data = text;
    }

    if (!response.ok) {

      console.error(
        "Supabase greška:",
        response.status,
        data
      );

      throw new Error(
        typeof data === "object"
          ? (
              data.message ||
              data.error ||
              JSON.stringify(data)
            )
          : data
      );
    }

    return data;
  }


  /* ============================================================
     HTML ESCAPE
     ============================================================ */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* ============================================================
     AUDIO URL
     ============================================================ */

  function validAudioUrl(value) {

    if (!value) {
      return false;
    }

    try {

      const url = new URL(value);

      return (
        url.protocol === "https:" ||
        url.protocol === "http:"
      );

    }

    catch {
      return false;
    }
  }


  /* ============================================================
     DATUM
     ============================================================ */

  function formatDatum(value) {

    if (!value) {
      return "";
    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return value;
    }

    return d.toLocaleString(
      "bs-BA",
      {
        dateStyle: "short",
        timeStyle: "medium"
      }
    );
  }


  /* ============================================================
     TRAJANJE
     ============================================================ */

  function formatDuration(seconds) {

    if (
      seconds === null ||
      seconds === undefined ||
      seconds === ""
    ) {
      return "";
    }

    seconds = Math.max(
      0,
      Math.floor(Number(seconds))
    );

    const hours =
      Math.floor(seconds / 3600);

    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );

    const secs =
      seconds % 60;

    if (hours > 0) {

      return (
        String(hours).padStart(2, "0")
        + ":"
        +
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(secs).padStart(2, "0")
      );
    }

    return (
      String(minutes).padStart(2, "0")
      + ":"
      +
      String(secs).padStart(2, "0")
    );
  }


  /* ============================================================
     STATUS
     ============================================================ */

  function normalizujStatus(status) {

    if (!status) {
      return "";
    }

    return String(status)
      .trim()
      .toLowerCase()
      .replaceAll(" ", "_");
  }


  function statusZavrsen(status) {

    const s = normalizujStatus(status);

    return [
      "completed",
      "complete",
      "hangup",
      "hung_up",
      "failed",
      "busy",
      "no_answer",
      "no-answer",
      "canceled",
      "cancelled",
      "error",
      "ended",
      "finished",
      "disconnected"
    ].includes(s);
  }


  function statusAktivan(status) {

    const s = normalizujStatus(status);

    return [
      "initiated",
      "ringing",
      "answered",
      "active",
      "in_progress",
      "in-progress",
      "call_in_progress",
      "poziv_u_toku"
    ].includes(s);
  }


  /* ============================================================
     UČITAJ POZIVE
     ============================================================ */

  async function ucitajPozive() {

    const container =
      document.getElementById(
        "tableContainer"
      );

    container.innerHTML =
      `<div class="loading">
        Učitavanje...
      </div>`;

    try {

      /*
       * ID se koristi samo interno.
       * Ne prikazuje se korisniku.
       */

      const data =
        await supabaseFetch(
          `/rest/v1/${TELNYX_TABLE}?select=*&order=CREATED_AT.desc,ID.desc`
        );

      sviPozivi =
        Array.isArray(data)
          ? data
          : [];

      renderTabela();

      document
        .getElementById("systemStatus")
        .textContent =
          `Učitano ${sviPozivi.length} kontakata.`;

    }

    catch (error) {

      console.error(error);

      container.innerHTML =
        `<div class="empty danger">
          Greška pri učitavanju:
          ${escapeHtml(error.message)}
        </div>`;

      document
        .getElementById("systemStatus")
        .textContent =
          "Greška pri komunikaciji sa bazom.";
    }
  }


  /* ============================================================
     RENDER TABELE
     ============================================================ */

  function renderTabela() {

    const container =
      document.getElementById(
        "tableContainer"
      );

    if (!sviPozivi.length) {

      container.innerHTML =
        `<div class="empty">
          Nema kontakata.
        </div>`;

      return;
    }


    let html = `

      <table>

        <thead>

          <tr>

            <th>FIRMA</th>

            <th>BROJ</th>

            <th>POČETAK POZIVA</th>

            <th>STATUS</th>

            <th>TRANSKRIPT</th>

            <th>AUDIO</th>

            <th>TRAJANJE</th>

          </tr>

        </thead>

        <tbody>
    `;


    for (
      const red
      of sviPozivi
    ) {

      const aktivan =
        aktivniPoziv &&
        Number(aktivniPoziv.id) ===
        Number(red.ID);


      const status =
        red.STATUS || "";


      let statusClass =
        "status";


      if (
        statusAktivan(status) ||
        aktivan
      ) {

        statusClass +=
          " status-active";

      }

      else if (
        statusZavrsen(status)
      ) {

        statusClass +=
          " status-finished";

      }

      else if (
        normalizujStatus(status)
          .includes("error")
      ) {

        statusClass +=
          " status-error";

      }

      else {

        statusClass +=
          " status-wait";
      }


      const transcript =
        red.TRANSCRIPT
          ? String(red.TRANSCRIPT)
          : "";


      const audio =
        red.AUDIO_URL || "";


      /*
       * POČETAK POZIVA
       *
       * Ovo je jedino vrijeme koje prikazujemo
       * korisniku.
       */

      const pocetakPoziva =
        red.POCETAK_POZIVA || "";


      html += `

        <tr
          class="${aktivan ? "call-active" : ""}"
          data-id="${escapeHtml(red.ID)}">

          <!-- FIRMA -->

          <td>
            <strong>
              ${escapeHtml(red.FIRMA)}
            </strong>
          </td>


          <!-- BROJ -->

          <td>
            ${escapeHtml(red.BROJ)}
          </td>


          <!-- POČETAK POZIVA -->

          <td class="start-time">

            ${
              pocetakPoziva
                ? escapeHtml(
                    formatDatum(
                      pocetakPoziva
                    )
                  )
                : '<span class="small">Nije pozvan</span>'
            }

          </td>


          <!-- STATUS -->

          <td class="${statusClass}">
            ${escapeHtml(status || "NIJE ZVAN")}
          </td>


          <!-- TRANSKRIPT + POZOVI -->

          <td class="transcript-cell">

            <div class="action-buttons">

              <!-- POZOVI JE ISPRED TRANSKRIPTA -->

              <button
                class="call-button"
                onclick="pozoviKontakt(
                  ${JSON.stringify(red.ID)},
                  ${JSON.stringify(red.BROJ)},
                  ${JSON.stringify(red.FIRMA || "")}
                )"
                ${aktivan ? "disabled" : ""}>

                ${
                  aktivan
                    ? "POZIV U TOKU..."
                    : "POZOVI"
                }

              </button>


              <button
                class="transcript-button"
                onclick="otvoriTranscript(
                  ${JSON.stringify(red.BROJ)}
                )">

                TRANSKRIPT

              </button>

            </div>


            ${
              transcript

                ?

                `
                <div class="transcript-text">
                  ${escapeHtml(transcript)}
                </div>
                `

                :

                `
                <div class="small">
                  Nema transkripta.
                </div>
                `
            }

          </td>


          <!-- AUDIO -->

          <td>

            ${
              validAudioUrl(audio)

              ?

              `
              <a
                class="audio-link"
                href="${escapeHtml(audio)}"
                target="_blank"
                rel="noopener">

                🔊 Pusti audio

              </a>
              `

              :

              `
              <span class="small">
                Nema audio fajla
              </span>
              `
            }

          </td>


          <!-- TRAJANJE -->

          <td>

            ${
              red.TRAJANJE_SEKUNDE !== null &&
              red.TRAJANJE_SEKUNDE !== undefined

                ?

                escapeHtml(
                  formatDuration(
                    red.TRAJANJE_SEKUNDE
                  )
                )

                :

                "-"
            }

          </td>

        </tr>
      `;
    }


    html += `

        </tbody>

      </table>
    `;


    container.innerHTML =
      html;
  }


  /* ============================================================
     POZIV KONTAKTA
     ============================================================ */

  async function pozoviKontakt(
    redId,
    broj,
    firma
  ) {

    if (!broj) {

      alert(
        "Kontakt nema broj telefona."
      );

      return;
    }


    if (aktivniPoziv) {

      alert(
        "Već postoji aktivan poziv."
      );

      return;
    }


    const potvrda =
      confirm(
        `Pozvati ${firma || broj}?\n\n${broj}`
      );

    if (!potvrda) {
      return;
    }


    /*
     * TAČAN POČETAK POZIVA
     *
     * Čuvamo vrijeme prije slanja
     * zahtjeva Telnyxu.
     */

    const start =
      new Date();


    aktivniPoziv = {

      id: redId,

      broj: broj,

      firma: firma,

      start: start

    };


    renderTabela();


    document
      .getElementById(
        "systemStatus"
      )
      .textContent =
        `Poziv prema ${broj} je u toku...`;


    try {

      /*
       * ČUVAMO POČETAK POZIVA
       */

      await updatePoziv(
        redId,
        {

          POCETAK_POZIVA:
            start.toISOString(),

          KRAJ_POZIVA:
            null,

          TRAJANJE_SEKUNDE:
            null,

          STATUS:
            "POZIV U TOKU",

          UPDATED_AT:
            new Date().toISOString()

        }
      );


      /*
       * POZIV TELNYX
       */

      const response =
        await fetch(
          EDGE_FUNCTION_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY

            },

            body: JSON.stringify({

              to_phone:
                broj,

              client_name:
                firma

            })

          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Edge Function greška."
        );
      }


      /*
       * TELNYX CALL ID SE I DALJE ČUVA U BAZI,
       * ALI SE NE PRIKAZUJE U TABELI.
       */

      if (
        result.call_control_id
      ) {

        await updatePoziv(
          redId,
          {

            TELNYX_CALL_ID:
              result.call_control_id,

            UPDATED_AT:
              new Date().toISOString()

          }
        );
      }


      await sinhronizujRazgovor(
        redId,
        broj
      );


      pokreniPolling(
        redId,
        broj
      );


      await ucitajPozive();

    }

    catch (error) {

      console.error(
        "Greška pri pozivu:",
        error
      );


      await updatePoziv(
        redId,
        {

          STATUS:
            "GREŠKA",

          KRAJ_POZIVA:
            new Date().toISOString(),

          UPDATED_AT:
            new Date().toISOString()

        }
      );


      aktivniPoziv = null;

      zaustaviPolling();


      await ucitajPozive();


      alert(
        "Poziv nije pokrenut:\n\n"
        +
        error.message
      );
    }
  }


  /* ============================================================
     UPDATE TELNYX_POZIVI
     ============================================================ */

  async function updatePoziv(
    redId,
    values
  ) {

    return await supabaseFetch(

      `/rest/v1/${TELNYX_TABLE}?ID=eq.${encodeURIComponent(redId)}`,

      {

        method: "PATCH",

        body:
          JSON.stringify(values)

      }

    );
  }


  /* ============================================================
     PRONAĐI NAJNOVIJI RAZGOVOR
     ============================================================ */

  async function pronadjiRazgovor(
    broj
  ) {

    if (!broj) {
      return null;
    }


    const url =
      `/rest/v1/${RAZGOVORI_TABLE}`
      +
      `?select=*`
      +
      `&BROJ=eq.${encodeURIComponent(broj)}`
      +
      `&order=ID.desc`
      +
      `&limit=1`;


    const data =
      await supabaseFetch(url);


    if (
      !Array.isArray(data) ||
      !data.length
    ) {

      return null;
    }


    return data[0];
  }


  /* ============================================================
     PRONAĐI VRIJEDNOST
     ============================================================ */

  function pronadjiVrijednost(
    obj,
    moguceKolone
  ) {

    if (!obj) {
      return null;
    }

    for (
      const kolona
      of moguceKolone
    ) {

      if (
        obj[kolona] !== undefined &&
        obj[kolona] !== null &&
        obj[kolona] !== ""
      ) {

        return obj[kolona];
      }
    }

    return null;
  }


  /* ============================================================
     SINHRONIZACIJA RAZGOVORA
     ============================================================ */

  async function sinhronizujRazgovor(
    redId,
    broj
  ) {

    try {

      const razgovor =
        await pronadjiRazgovor(
          broj
        );


      if (!razgovor) {
        return null;
      }


      const razgovoriId =
        pronadjiVrijednost(
          razgovor,
          [
            "ID",
            "id"
          ]
        );


      const status =
        pronadjiVrijednost(
          razgovor,
          [
            "STATUS",
            "status",
            "CALL_STATUS",
            "call_status"
          ]
        );


      const transcript =
        pronadjiVrijednost(
          razgovor,
          [
            "TRANSCRIPT",
            "transcript"
          ]
        );


      const audioUrl =
        pronadjiVrijednost(
          razgovor,
          [
            RAZGOVORI_AUDIO_COLUMN,
            "AUDIO_URL",
            "audio_url",
            "AUDIO",
            "audio",
            "RECORDING_URL",
            "recording_url",
            "RECORDING",
            "recording"
          ]
        );


      const vrijeme =
        pronadjiVrijednost(
          razgovor,
          [
            "VRIJEME",
            "vrijeme",
            "CREATED_AT",
            "created_at"
          ]
        );


      const updateData = {};


      /*
       * OVI PODACI SE KORISTE U POZADINI,
       * ALI SE NE PRIKAZUJU U TABELI.
       */

      if (
        razgovoriId !== null
      ) {

        updateData.RAZGOVORI_ID =
          Number(razgovoriId);
      }


      if (
        status !== null
      ) {

        updateData.STATUS =
          String(status);
      }


      if (
        transcript !== null
      ) {

        updateData.TRANSCRIPT =
          String(transcript);
      }


      if (
        audioUrl !== null
      ) {

        updateData.AUDIO_URL =
          String(audioUrl);
      }


      if (
        vrijeme !== null &&
        !updateData.POCETAK_POZIVA
      ) {

        /*
         * VRIJEME iz razgovora ne mijenjamo
         * ako već imamo POCETAK_POZIVA.
         */

      }


      updateData.UPDATED_AT =
        new Date().toISOString();


      if (
        Object.keys(updateData).length > 0
      ) {

        await updatePoziv(
          redId,
          updateData
        );
      }


      if (
        statusZavrsen(status)
      ) {

        await zavrsiPoziv(
          redId
        );

        return {
          ...razgovor,
          __finished: true
        };
      }


      return razgovor;

    }

    catch (error) {

      console.error(
        "Greška sinhronizacije:",
        error
      );

      return null;
    }
  }


  /* ============================================================
     POLLING
     ============================================================ */

  function pokreniPolling(
    redId,
    broj
  ) {

    zaustaviPolling();


    pollingTimer =
      setInterval(
        async () => {

          await provjeriPoziv(
            redId,
            broj
          );

        },
        5000
      );


    provjeriPoziv(
      redId,
      broj
    );
  }


  function zaustaviPolling() {

    if (pollingTimer) {

      clearInterval(
        pollingTimer
      );

      pollingTimer = null;
    }
  }


  /* ============================================================
     PROVJERI POZIV
     ============================================================ */

  async function provjeriPoziv(
    redId,
    broj
  ) {

    try {

      const razgovor =
        await sinhronizujRazgovor(
          redId,
          broj
        );


      if (
        razgovor &&
        razgovor.__finished
      ) {

        return;
      }


      const red =
        await ucitajJedanPoziv(
          redId
        );


      if (!red) {
        return;
      }


      if (
        statusZavrsen(
          red.STATUS
        )
      ) {

        await zavrsiPoziv(
          redId
        );

        return;
      }


      renderTabela();


      document
        .getElementById(
          "systemStatus"
        )
        .textContent =
          `Poziv ${broj} je u toku...`;

    }

    catch (error) {

      console.error(
        "Polling greška:",
        error
      );
    }
  }


  /* ============================================================
     UČITAJ JEDAN POZIV
     ============================================================ */

  async function ucitajJedanPoziv(
    redId
  ) {

    const data =
      await supabaseFetch(

        `/rest/v1/${TELNYX_TABLE}?select=*&ID=eq.${encodeURIComponent(redId)}&limit=1`

      );


    if (
      !Array.isArray(data) ||
      !data.length
    ) {

      return null;
    }


    return data[0];
  }


  /* ============================================================
     ZAVRŠI POZIV
     ============================================================ */

  async function zavrsiPoziv(
    redId
  ) {

    try {

      const red =
        await ucitajJedanPoziv(
          redId
        );


      if (!red) {
        return;
      }


      let start =
        red.POCETAK_POZIVA;


      if (
        !start &&
        aktivniPoziv &&
        Number(aktivniPoziv.id) ===
        Number(redId)
      ) {

        start =
          aktivniPoziv.start;
      }


      const kraj =
        new Date();


      let trajanje =
        null;


      if (start) {

        const startDate =
          new Date(start);


        if (
          !isNaN(
            startDate.getTime()
          )
        ) {

          trajanje =
            Math.max(
              0,
              Math.round(
                (
                  kraj.getTime()
                  -
                  startDate.getTime()
                ) / 1000
              )
            );
        }
      }


      await updatePoziv(
        redId,
        {

          KRAJ_POZIVA:
            kraj.toISOString(),

          TRAJANJE_SEKUNDE:
            trajanje,

          UPDATED_AT:
            kraj.toISOString()

        }
      );


      zaustaviPolling();

      aktivniPoziv = null;


      document
        .getElementById(
          "systemStatus"
        )
        .textContent =
          trajanje !== null
            ?
            `Poziv završen. Trajanje: ${formatDuration(trajanje)}`
            :
            "Poziv završen.";


      await ucitajPozive();

    }

    catch (error) {

      console.error(
        "Greška završetka poziva:",
        error
      );
    }
  }


  /* ============================================================
     SLEDEĆI POZIV
     ============================================================ */

  async function sledeciPoziv() {

    zaustaviPolling();

    aktivniPoziv = null;

    await ucitajPozive();


    document
      .getElementById(
        "systemStatus"
      )
      .textContent =
        "Spreman za sljedeći poziv.";
  }


  /* ============================================================
     TRANSCRIPT
     ============================================================ */

  function otvoriTranscript(
    broj
  ) {

    if (!broj) {

      alert(
        "Broj telefona nije pronađen."
      );

      return;
    }


    window.open(

      "TRANSCRIPT.HTML?phone="
      +
      encodeURIComponent(broj),

      "_blank"

    );
  }


  /* ============================================================
     MODAL
     ============================================================ */

  function otvoriDodajKontakte() {

    document
      .getElementById(
        "contactModal"
      )
      .style.display =
        "flex";
  }


  function zatvoriDodajKontakte() {

    document
      .getElementById(
        "contactModal"
      )
      .style.display =
        "none";
  }


  /* ============================================================
     DODAJ KONTAKTE
     ============================================================ */

  async function sacuvajKontakte() {

    const input =
      document.getElementById(
        "contactsInput"
      );


    const text =
      input.value.trim();


    if (!text) {

      alert(
        "Unesi barem jedan kontakt."
      );

      return;
    }


    const lines =
      text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);


    const kontakti = [];


    for (
      const line
      of lines
    ) {

      let parts =
        line.includes("|")
          ? line.split("|")
          : line.split(",");


      if (
        parts.length < 2
      ) {

        continue;
      }


      const firma =
        parts[0].trim();


      const broj =
        parts
          .slice(1)
          .join(",")
          .trim();


      if (!broj) {
        continue;
      }


      kontakti.push({

        FIRMA:
          firma || "NEPOZNATO",

        BROJ:
          broj,

        STATUS:
          "NIJE ZVAN",

        CREATED_AT:
          new Date().toISOString(),

        UPDATED_AT:
          new Date().toISOString()

      });
    }


    if (!kontakti.length) {

      alert(
        "Nisam pronašao ispravan format.\n\n" +
        "Koristi:\n" +
        "FIRMA | +15551234567"
      );

      return;
    }


    try {

      await supabaseFetch(

        `/rest/v1/${TELNYX_TABLE}`,

        {

          method: "POST",

          body:
            JSON.stringify(
              kontakti
            )

        }

      );


      input.value = "";

      zatvoriDodajKontakte();

      await ucitajPozive();


      alert(
        `Dodano kontakata: ${kontakti.length}`
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Greška pri dodavanju kontakata:\n\n"
        +
        error.message
      );
    }
  }


  /* ============================================================
     AUTOMATSKO OSVJEŽAVANJE
     ============================================================ */

  function pokreniAutoRefresh() {

    if (autoRefreshTimer) {

      clearInterval(
        autoRefreshTimer
      );
    }


    autoRefreshTimer =
      setInterval(
        async () => {

          if (aktivniPoziv) {
            return;
          }

          await ucitajPozive();

        },
        5000
      );
  }


  /* ============================================================
     INIT
     ============================================================ */

  document.addEventListener(
    "DOMContentLoaded",
    async () => {

      await ucitajPozive();

      pokreniAutoRefresh();

    }
  );

</script>
