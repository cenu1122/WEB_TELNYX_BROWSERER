<!DOCTYPE html>
<html lang="bs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TELNYX POZIVI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 28px;
        }

        .top-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-next {
            background: #16a34a;
            color: white;
        }

        .btn-refresh {
            background: #64748b;
            color: white;
        }

        .btn-transcript {
            background: #7c3aed;
            color: white;
        }

        .btn-call {
            background: #0891b2;
            color: white;
        }

        .status-box {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);
        }

        .status-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .small {
            font-size: 12px;
            color: #64748b;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
        }

        th {
            padding: 12px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .active-row {
            background: #ecfdf5 !important;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        .status-active {
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         NASLOV
    ====================================================== -->

    <h1>
        TELNYX POZIVI
    </h1>


    <!-- =====================================================
         GORNJA DUGMAD
    ====================================================== -->

    <div class="top-bar">

        <button
            class="btn-primary"
            onclick="dodajKontakt()"
        >
            + DODAJ KONTAKT
        </button>


        <button
            class="btn-next"
            onclick="sledeciPoziv()"
        >
            SLEDEĆI POZIV
        </button>


        <button
            class="btn-refresh"
            onclick="ucitajPodatke()"
        >
            OSVJEŽI
        </button>

    </div>


    <!-- =====================================================
         STATUS AKTIVNOG POZIVA
    ====================================================== -->

    <div class="status-box">

        <strong id="statusNaslov">
            STATUS: NEMA AKTIVNOG POZIVA
        </strong>

        <div
            id="statusDetalji"
            class="small"
        >
            Spremno.
        </div>

    </div>


    <!-- =====================================================
         TABELA
    ====================================================== -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        FIRMA
                    </th>

                    <th>
                        BROJ
                    </th>

                    <th>
                        STATUS
                    </th>

                    <th>
                        VRIJEME
                    </th>

                    <th>
                        TRANSCRIPT
                    </th>

                    <th>
                        TELNYX CALL ID
                    </th>

                    <th>
                        CREATED AT
                    </th>

                    <th>
                        UPDATED AT
                    </th>

                    <th>
                        AKCIJA
                    </th>

                </tr>

            </thead>


            <tbody id="tabelaPodaci">

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        UČITAVANJE...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


    /* =====================================================
       SUPABASE PODACI
    ====================================================== */

    const SUPABASE_URL =
        'https://uduwpvdjmanrgpumdrfh.supabase.co';


    const SUPABASE_KEY =
        'sb_publishable_DMELD0DRGcKD9u12lowjgw_sPBaLqhT';


    const EDGE_FUNCTION_URL =
        SUPABASE_URL +
        '/functions/v1/TELNYX_POZIVI';


    const TABELA =
        'TELNYX_POZIVI';


    /* =====================================================
       VARIJABLE
    ====================================================== */

    let sviRedovi = [];

    let aktivniIndex = -1;

    let aktivniCallControlId = null;

    let pollingTimer = null;


    /* =====================================================
       ZAVRŠENI STATUSI
    ====================================================== */

    const ZAVRSENI_STATUSI = [

        'completed',

        'hangup',

        'hung_up',

        'failed',

        'busy',

        'no_answer',

        'no-answer',

        'canceled',

        'cancelled',

        'error'

    ];


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return '';

        }


        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            );

    }


    /* =====================================================
       TRANSCRIPT

       OTVARA:

       TRANSCRIPT.HTML?phone=...
    ====================================================== */

    function otvoriTranscript(broj) {

        if (!broj) {

            alert(
                'BROJ TELEFONA NIJE PRONAĐEN.'
            );

            return;

        }


        window.location.href =
            'TRANSCRIPT.HTML?phone=' +
            encodeURIComponent(broj);

    }


    /* =====================================================
       UČITAVANJE PODATAKA IZ TELNYX_POZIVI
    ====================================================== */

    async function ucitajPodatke() {

        try {

            const url =
                SUPABASE_URL +
                '/rest/v1/' +
                TABELA +
                '?select=*' +
                '&order=CREATED_AT.desc,ID.desc';


            const response =
                await fetch(
                    url,
                    {

                        method: 'GET',

                        headers: {

                            'apikey':
                                SUPABASE_KEY,

                            'Authorization':
                                'Bearer ' +
                                SUPABASE_KEY,

                            'Content-Type':
                                'application/json'

                        }

                    }
                );


            if (!response.ok) {

                const greska =
                    await response.text();

                throw new Error(
                    greska
                );

            }


            sviRedovi =
                await response.json();


            prikaziTabelu();


            if (
                aktivniIndex >= 0
            ) {

                provjeriAktivniPoziv();

            }

        } catch (error) {

            console.error(
                'GREŠKA:',
                error
            );


            document.getElementById(
                'tabelaPodaci'
            ).innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >

                        GREŠKA PRI UČITAVANJU
                        PODATAKA.

                    </td>

                </tr>

            `;

        }

    }


    /* =====================================================
       PRIKAZ TABELE
    ====================================================== */

    function prikaziTabelu() {

        const tbody =
            document.getElementById(
                'tabelaPodaci'
            );


        if (
            !sviRedovi ||
            sviRedovi.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >

                        NEMA PODATAKA.

                    </td>

                </tr>

            `;

            return;

        }


        tbody.innerHTML =

            sviRedovi.map(

                (red, index) => {


                    const jeAktivan =
                        index ===
                        aktivniIndex;


                    return `

                        <tr
                            class="${
                                jeAktivan
                                ? 'active-row'
                                : ''
                            }"
                        >

                            <td>
                                ${
                                    escapeHtml(
                                        red.ID
                                    )
                                }
                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.FIRMA
                                    )
                                }
                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.BROJ
                                    )
                                }
                            </td>


                            <td
                                class="status-active"
                            >
                                ${
                                    escapeHtml(
                                        red.STATUS
                                    )
                                }
                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.VRIJEME
                                    )
                                }
                            </td>


                            <td>

                                <button
                                    class="btn-transcript"
                                    onclick="otvoriTranscript(
                                        '${escapeHtml(
                                            red.BROJ || ''
                                        )}'
                                    )"
                                >

                                    TRANSCRIPT

                                </button>

                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.TELNYX_CALL_ID
                                    )
                                }
                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.CREATED_AT
                                    )
                                }
                            </td>


                            <td>
                                ${
                                    escapeHtml(
                                        red.UPDATED_AT
                                    )
                                }
                            </td>


                            <td>

                                <button
                                    class="btn-call"
                                    onclick="pozoviBroj(
                                        '${escapeHtml(
                                            red.BROJ || ''
                                        )}',
                                        '${escapeHtml(
                                            red.FIRMA || ''
                                        )}'
                                    )"
                                >

                                    POZOVI

                                </button>

                            </td>

                        </tr>

                    `;

                }

            ).join('');

    }


    /* =====================================================
       DODAJ KONTAKT
    ====================================================== */

    function dodajKontakt() {

        const firma =
            prompt(
                'UNESITE NAZIV FIRME:'
            );


        if (!firma) {

            return;

        }


        const broj =
            prompt(
                'UNESITE BROJ TELEFONA:'
            );


        if (!broj) {

            return;

        }


        const postojeci =
            JSON.parse(

                localStorage.getItem(
                    'TELNYX_KONTAKTI'
                ) || '[]'

            );


        postojeci.push({

            firma: firma,

            broj: broj

        });


        localStorage.setItem(

            'TELNYX_KONTAKTI',

            JSON.stringify(
                postojeci
            )

        );


        alert(
            'KONTAKT JE DODAT.'
        );

    }


    /* =====================================================
       POKRETANJE POZIVA
    ====================================================== */

    async function pozoviBroj(
        broj,
        firma
    ) {

        if (!broj) {

            alert(
                'BROJ TELEFONA NIJE PRONAĐEN.'
            );

            return;

        }


        try {


            document.getElementById(
                'statusNaslov'
            ).textContent =
                'STATUS: POKRETANJE POZIVA...';


            document.getElementById(
                'statusDetalji'
            ).textContent =
                firma +
                ' — ' +
                broj;


            const response =
                await fetch(

                    EDGE_FUNCTION_URL,

                    {

                        method: 'POST',

                        headers: {

                            'Content-Type':
                                'application/json',

                            'apikey':
                                SUPABASE_KEY,

                            'Authorization':
                                'Bearer ' +
                                SUPABASE_KEY

                        },

                        body:
                            JSON.stringify({

                                to_phone:
                                    broj,

                                client_name:
                                    firma

                            })

                    }

                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(

                    data.error ||
                    'GREŠKA PRI POKRETANJU POZIVA.'

                );

            }


            /*
               TELNYX CALL CONTROL ID
            */

            aktivniCallControlId =
                data.call_control_id ||
                null;


            /*
               Pronađi najnoviji red
               za ovaj broj
            */

            aktivniIndex =
                pronadjiNajnovijiRedZaBroj(
                    broj
                );


            document.getElementById(
                'statusNaslov'
            ).textContent =
                'STATUS: POZIV AKTIVAN';


            document.getElementById(
                'statusDetalji'
            ).textContent =
                firma +
                ' — ' +
                broj;


            prikaziTabelu();


            /*
               Počni provjeravati status
            */

            pokreniPolling();


            /*
               Odmah osvježi podatke
            */

            setTimeout(

                () => {

                    ucitajPodatke();

                },

                1000

            );


        } catch (error) {

            console.error(
                error
            );


            document.getElementById(
                'statusNaslov'
            ).textContent =
                'STATUS: GREŠKA';


            document.getElementById(
                'statusDetalji'
            ).textContent =
                error.message;


            alert(
                error.message
            );

        }

    }


    /* =====================================================
       PRONAĐI NAJNOVIJI RED ZA BROJ
    ====================================================== */

    function pronadjiNajnovijiRedZaBroj(
        broj
    ) {

        for (
            let i = 0;
            i < sviRedovi.length;
            i++
        ) {

            if (

                String(
                    sviRedovi[i].BROJ
                ) ===

                String(
                    broj
                )

            ) {

                return i;

            }

        }


        return -1;

    }


    /* =====================================================
       POLLING
    ====================================================== */

    function pokreniPolling() {

        zaustaviPolling();


        pollingTimer =

            setInterval(

                async () => {

                    await ucitajPodatke();

                },

                5000

            );

    }


    /* =====================================================
       ZAUSTAVI POLLING
    ====================================================== */

    function zaustaviPolling() {

        if (
            pollingTimer
        ) {

            clearInterval(
                pollingTimer
            );

            pollingTimer = null;

        }

    }


    /* =====================================================
       PROVJERA STATUSA AKTIVNOG POZIVA
    ====================================================== */

    function provjeriAktivniPoziv() {

        if (
            aktivniIndex < 0
        ) {

            return;

        }


        let aktivniRed =
            null;


        /*
           Prvo tražimo po
           TELNYX CALL ID
        */

        if (
            aktivniCallControlId
        ) {

            aktivniRed =
                sviRedovi.find(

                    red =>

                        String(
                            red.TELNYX_CALL_ID ||
                            ''
                        ) ===

                        String(
                            aktivniCallControlId
                        )

                );

        }


        /*
           Ako nema CALL ID-a,
           tražimo po broju.
        */

        if (
            !aktivniRed
        ) {

            const stariRed =
                sviRedovi[
                    aktivniIndex
                ];


            if (
                stariRed
            ) {

                aktivniRed =
                    sviRedovi.find(

                        red =>

                            String(
                                red.BROJ ||
                                ''
                            ) ===

                            String(
                                stariRed.BROJ ||
                                ''
                            )

                    );

            }

        }


        if (
            !aktivniRed
        ) {

            return;

        }


        const status =
            String(
                aktivniRed.STATUS ||
                ''
            ).toLowerCase();


        document.getElementById(
            'statusNaslov'
        ).textContent =

            'STATUS: ' +

            String(
                aktivniRed.STATUS ||
                'NEPOZNATO'
            ).toUpperCase();


        document.getElementById(
            'statusDetalji'
        ).textContent =

            (
                aktivniRed.FIRMA ||
                ''
            ) +

            ' — ' +

            (
                aktivniRed.BROJ ||
                ''
            );


        /*
           Ako je poziv završen,
           zaustavi polling.
        */

        if (

            ZAVRSENI_STATUSI.includes(
                status
            )

        ) {

            zaustaviPolling();

        }

    }


    /* =====================================================
       SLEDEĆI POZIV

       VAŽNO:
       OVDJE SE NIŠTA NE BRIŠE.

       Prethodni zapis ostaje
       u TELNYX_POZIVI.
    ====================================================== */

    function sledeciPoziv() {

        zaustaviPolling();


        aktivniIndex = -1;

        aktivniCallControlId = null;


        document.getElementById(
            'statusNaslov'
        ).textContent =
            'STATUS: NEMA AKTIVNOG POZIVA';


        document.getElementById(
            'statusDetalji'
        ).textContent =
            'SPREMNO ZA SLEDEĆI POZIV.';


        prikaziTabelu();

    }


    /* =====================================================
       POČETNO UČITAVANJE
    ====================================================== */

    ucitajPodatke();


    /* =====================================================
       AUTOMATSKO OSVJEŽAVANJE
       
       Svakih 5 sekundi učitava
       najnovije podatke.
    ====================================================== */

    setInterval(

        () => {

            ucitajPodatke();

        },

        5000

    );


</script>

</body>

</html>
