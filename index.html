<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Telnyx Masovni Pozivi - Lang Love</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .container { background: white; padding: 25px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 620px; text-align: left; }
        textarea { width: 100%; height: 120px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        button { padding: 8px 12px; font-size: 13px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; margin-right: 3px; }
        button:hover { background-color: #0056b3; }
        .btn-transcript { background-color: #17a2b8; }
        .btn-transcript:hover { background-color: #138496; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        h2 { text-align: center; color: #333; }
        ul { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #eee; margin-top: 15px; border-radius: 4px; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        li:last-child { border-bottom: none; }
        .firma-col { font-weight: bold; color: #444; width: 30%; }
        .broj-col { color: #007bff; width: 25%; }
        .info-tekst { font-size: 11px; color: #555; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Telnyx Upravljanje Brojevima</h2>
    <p>Unesi više unosa odjednom (Format: <strong>Naziv firme, Broj</strong> - svaki u novi red):</p>
    <textarea id="listaBrojeva" placeholder="B&B Woodworking, 5551111111&#10;Apex Roofing, +15552222222"></textarea>
    <br>
    <button onclick="sacuvajPodatke()">Sačuvaj sve u memoriju</button>
    <button onclick="ocistiMemoriju()" class="btn-danger">Obriši sve</button>

    <h3>Sačuvani unosi:</h3>
    <ul id="prikazPodataka"></ul>
</div>

<script>
    const SUPABASE_URL = 'https://lvvidixbdtdjfwxxxqzr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DMELD0DRGCKd9u12lowjgw_sPBal...'; // Unesi svoj ključ ovdje

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = prikaziPodatke;

    function formatirajUSBroj(br) {
        br = br.replace(/[\s\-\.\(\)]/g, '');
        if (br === "") return "";

        if (br.startsWith('00')) {
            br = '+' + br.substring(2);
        } else if (br.length === 10 && !br.startsWith('+')) {
            br = '+1' + br;
        } else if (br.length === 11 && br.startsWith('1')) {
            br = '+' + br;
        } else if (!br.startsWith('+') && br.length > 6) {
            br = '+' + br;
        }
        return br;
    }

    function sacuvajPodatke() {
        const tekst = document.getElementById('listaBrojeva').value;
        if (!tekst.trim()) {
            alert('Molimo unesite podatke!');
            return;
        }

        let noveStavke = [];
        let linije = tekst.split('\n');

        for (let linija of linije) {
            if (!linija.trim()) continue;

            let dijelovi = linija.split(/,|\t/);
            
            if (dijelovi.length >= 2) {
                let firma = dijelovi[0].trim();
                let siroviBroj = dijelovi.slice(1).join('').trim();
                let broj = formatirajUSBroj(siroviBroj);

                if (firma && broj) {
                    noveStavke.push({ 
                        firma: firma, 
                        broj: broj,
                        status: 'Nije zvan',
                        vrijeme: ''
                    });
                }
            }
        }

        if (noveStavke.length === 0) {
            alert('Neispravan format! Provjerite jeste li odvojili naziv firme i broj zarezom.');
            return;
        }

        let postojeci = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        let kombinovano = [...postojeci];
        
        noveStavke.push = noveStavke.forEach(novi => {
            if (!kombinovano.some(p => p.broj === novi.broj)) {
                kombinovano.push(novi);
            }
        });

        localStorage.setItem('telnyx_saved_entries', JSON.stringify(kombinovano));
        document.getElementById('listaBrojeva').value = '';
        prikaziPodatke();
        alert('Uspješno sačuvano unosa!');
    }

    function prikaziPodatke() {
        const lista = document.getElementById('prikazPodataka');
        lista.innerHTML = '';
        
        let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        
        if (unosi.length === 0) {
            lista.innerHTML = '<li style="text-align:center; color:#888; display:block;">Nema sačuvanih unosa</li>';
            return;
        }

        unosi.forEach((unos, index) => {
            let li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <span class="firma-col"><strong>${unos.firma}</strong></span>
                    <span class="broj-col">${unos.broj}</span>
                    <div class="info-tekst">Status: ${unos.status} ${unos.vrijeme ? '(' + unos.vrijeme + ')' : ''}</div>
                </div>
                <div>
                    <button onclick="pozoviBroj('${unos.broj}', ${index}, this)">Pozovi</button>
                    <button class="btn-transcript" onclick="otvoriTranscript('${unos.broj}')">Transcript</button>
                    <button onclick="obrisiJedan(${index})" class="btn-danger">X</button>
                </div>
            `;
            lista.appendChild(li);
        });
    }

    async function pozoviBroj(telefon, index, btnElement) {
    btnElement.innerText = 'Zove...';
    btnElement.disabled = true;

    try {
        const response = await fetch('https://lvvidixbdtdjfwxxxqzr.supabase.co/functions/v1/TELNYX_POZIVI', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer OVDJE_STAVI_SVOJ_ANON_KLJUC' // Unesi svoj publishable/anon ključ ovdje
            },
            body: JSON.stringify({ phone_number: telefon })
        });

        if (!response.ok) {
            throw new Error('Server je vratio grešku: ' + response.status);
        }

        const data = await response.json();
        console.log('Uspjeh:', data);

        let datumVrijeme = new Date().toLocaleString('hr-HR');
        let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        unosi[index].status = 'Pozvan';
        unosi[index].vrijeme = datumVrijeme;
        localStorage.setItem('telnyx_saved_entries', JSON.stringify(unosi));

        prikaziPodatke();
    } catch (err) {
        alert('Greška pri pozivanju: ' + err.message);
        btnElement.innerText = 'Pozovi';
        btnElement.disabled = false;
        console.error(err);
    }
}
    function obrisiJedan(index) {
        let unosi = JSON.parse(localStorage.getItem('telnyx_saved_entries')) || [];
        unosi.splice(index, 1);
        localStorage.setItem('telnyx_saved_entries', JSON.stringify(unosi));
        prikaziPodatke();
    }

    function ocistiMemoriju() {
        if (confirm('Da li ste sigurni da želite obrisati sve sačuvane podatke?')) {
            localStorage.removeItem('telnyx_saved_entries');
            prikaziPodatke();
        }
    }
</script>

</body>
</html>
