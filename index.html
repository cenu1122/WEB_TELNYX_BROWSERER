<head>

    textarea {

    .next-button {

    }

    }
  </style>

<body>

  <h1>TELNYX POZIVI</h1>

  <div class="topbar">

    <button

  <!-- ========================= -->
  <!-- MODAL DODAJ KONTAKTE -->

  <div
    id="contactModal"

    <div class="modal">

      <h2>DODAJ KONTAKTE</h2>

      <textarea

        placeholder="ABC COMPANY | +15551234567
XYZ COMPANY | +15557654321"></textarea>

      <div class="modal-actions">

        <button

  </div>


<script>

  /* ============================================================
     KONFIGURACIJA (Ažurirana na novi Supabase projekat i ključ)
     ============================================================ */

  const SUPABASE_URL =
    "https://lvvidixbdtdjfwxxxqzr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DMELD0DRGcKD9u12lowjgw_sPBaLqhTOK";

  const EDGE_FUNCTION_URL =
    "https://lvvidixbdtdjfwxxxqzr.supabase.co/functions/v1/telnyx_špopozivic";


  const TELNYX_TABLE =
    "telnyyx_pozivi";

  const RAZGOVORI_TABLE =
    "RAZGOVORI_TELNYX";


  /*
     OVDJE JE NAZIV AUDIO KOLONE U RAZGOVORI_TELNYX.
  */

  const RAZGOVORI_AUDIO_COLUMN =
    "AUDIO_URL";


  /* ============================================================
     STANJE APLIKACIJE
     ============================================================ */

  let sviPozivi = [];

  let aktivniPoziv = null;

  let pollingTimer = null;

  let autoRefreshTimer = null;


  /* ============================================================
     SUPABASE REST
     ============================================================ */

  async function supabaseFetch(
    path,
    options = {}
  ) {

    const response =
      await fetch(
        SUPABASE_URL + path,
        {
          ...options,

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",

            ...(options.headers || {})
          }
        }
      );

    const text =
      await response.text();

    let data = null;

    try {
      data = text
        ? JSON.parse(text)
        : null;
    }

    catch {
      data = text;
    }

    if (!response.ok) {

      console.error(
        "Supabase greška:",
        response.status,
        data
      );

      throw new Error(
        typeof data === "object"
          ? (
            data.message ||
            data.error ||
            JSON.stringify(data)
          )
          : data
      );
    }

    return data;
  }


  /* ============================================================
     HTML ESCAPE
     ============================================================ */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* ============================================================
     URL VALIDACIJA
     ============================================================ */

  function validAudioUrl(value) {

    if (!value) {
      return false;
    }

    try {

      const url =
        new URL(value);

      return (
        url.protocol === "https:" ||
        url.protocol === "http:"
      );

    }

    catch {
      return false;
    }
  }


  /* ============================================================
     DATUM
     ============================================================ */

  function formatDatum(value) {

    if (!value) {
      return "";
    }

    const d =
      new Date(value);

    if (isNaN(d.getTime())) {
      return value;
    }

    return d.toLocaleString(
      "bs-BA",
      {
        dateStyle: "short",
        timeStyle: "medium"
      }
    );
  }


  /* ============================================================
     TRAJANJE
     ============================================================ */

  function formatDuration(seconds) {

    if (
      seconds === null ||
      seconds === undefined ||
      seconds === ""
    ) {
      return "";
    }

    seconds =
      Math.max(
        0,
        Math.floor(Number(seconds))
      );

    const hours =
      Math.floor(seconds / 3600);

    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );

    const secs =
      seconds % 60;

    if (hours > 0) {

      return (
        String(hours).padStart(2, "0")
        + ":"
        +
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(secs).padStart(2, "0")
      );
    }

    return (
      String(minutes).padStart(2, "0")
      + ":"
      +
      String(secs).padStart(2, "0")
    );
  }


  /* ============================================================
     NORMALIZACIJA STATUSA
     ============================================================ */

  function normalizujStatus(status) {

    if (!status) {
      return "";
    }

    return String(status)
      .trim()
      .toLowerCase()
      .replaceAll(" ", "_");
  }


  function statusZavrsen(status) {

    const s =
      normalizujStatus(status);

    return [

      "completed",
      "complete",

      "hangup",
      "hung_up",

      "failed",

      "busy",

      "no_answer",
      "no-answer",

      "canceled",
      "cancelled",

      "error",

      "ended",
      "finished",

      "disconnected"

    ].includes(s);
  }


  function statusAktivan(status) {

    const s =
      normalizujStatus(status);

    return [

      "initiated",
      "ringing",
      "answered",
      "active",
      "in_progress",
      "in-progress",
      "call_in_progress",
      "poziv_u_toku"

    ].includes(s);
  }


  /* ============================================================
     PRONAĐI VRIJEDNOST IZ RAZGOVORI_TELNYX
     ============================================================ */

  function pronadjiVrijednost(
    obj,
    moguceKolone
  ) {

    if (!obj) {
      return null;
    }

    for (
      const kolona
      of moguceKolone
    ) {

      if (
        obj[kolona] !== undefined &&
        obj[kolona] !== null &&
        obj[kolona] !== ""
      ) {

        return obj[kolona];
      }
    }

    return null;
  }


  /* ============================================================
     UČITAJ TELNYX_POZIVI
     ============================================================ */

  async function ucitajPozive() {

    const container =
      document.getElementById(
        "tableContainer"
      );

    container.innerHTML =
      `<div class="loading">
        Učitavanje...
      </div>`;

    try {

      const data =
        await supabaseFetch(
          `/rest/v1/${TELNYX_TABLE}?select=*&order=CREATED_AT.desc,ID.desc`
        );

      sviPozivi =
        Array.isArray(data)
          ? data
          : [];

      renderTabela();

      document
        .getElementById("systemStatus")
        .textContent =
          `Učitano ${sviPozivi.length} kontakata.`;

    }

    catch (error) {

      console.error(error);

      container.innerHTML =
        `<div class="empty danger">
          Greška pri učitavanju:
          ${escapeHtml(error.message)}
        </div>`;

      document
        .getElementById("systemStatus")
        .textContent =
          "Greška pri komunikaciji sa bazom.";
    }
  }


  /* ============================================================
     RENDER TABELE
     ============================================================ */

  function renderTabela() {

    const container =
      document.getElementById(
        "tableContainer"
      );

    if (!sviPozivi.length) {

      container.innerHTML =
        `<div class="empty">
          Nema kontakata u TELNYX_POZIVI.
        </div>`;

      return;
    }


    let html = `

      <table>

        <thead>

          <tr>

            <th>ID</th>

            <th>FIRMA</th>

            <th>BROJ</th>

            <th>STATUS</th>

            <th>VRIJEME</th>

            <th>TRANSCRIPT</th>

            <th>AUDIO</th>

            <th>TELNYX CALL ID</th>

            <th>RAZGOVORI ID</th>

            <th>POČETAK POZIVA</th>

            <th>KRAJ POZIVA</th>

            <th>TRAJANJE</th>

            <th>CREATED AT</th>

            <th>UPDATED AT</th>

            <th>AKCIJA</th>

          </tr>

        </thead>

        <tbody>
    `;


    for (
      const red
      of sviPozivi
    ) {

      const aktivan =
        aktivniPoziv &&
        Number(aktivniPoziv.id) ===
        Number(red.ID);


      const status =
        red.STATUS || "";


      let statusClass =
        "status";


      if (
        statusAktivan(status) ||
        aktivan
      ) {

        statusClass +=
          " status-active";

      }

      else if (
        statusZavrsen(status)
      ) {

        statusClass +=
          " status-finished";

      }

      else if (
        normalizujStatus(status)
          .includes("error")
      ) {

        statusClass +=
          " status-error";

      }

      else {

        statusClass +=
          " status-wait";
      }


      const transcript =
        red.TRANSCRIPT
          ? String(red.TRANSCRIPT)
          : "";


      const audio =
        red.AUDIO_URL || "";


      html += `

        <tr
          class="${aktivan ? "call-active" : ""}"
          data-id="${escapeHtml(red.ID)}">

          <td>
            ${escapeHtml(red.ID)}
          </td>

          <td>
            ${escapeHtml(red.FIRMA)}
          </td>

          <td>
            ${escapeHtml(red.BROJ)}
          </td>

          <td class="${statusClass}">
            ${escapeHtml(status)}
          </td>

          <td>
            ${escapeHtml(
              formatDatum(red.VRIJEME)
            )}
          </td>

          <td class="transcript-cell">

            <div class="transcript-text">

              ${
                transcript
                  ? escapeHtml(
                      transcript.toUpperCase()
                    )
                  : "-"
              }

            </div>

            <br>

            <button
              class="transcript-button"
              onclick="otvoriTranscript('${escapeHtml(red.BROJ)}')">

              TRANSCRIPT

            </button>

          </td>

          <td class="audio-cell">

            ${
              validAudioUrl(audio)

              ?

              `
              <audio
                controls
                preload="none"
                src="${escapeHtml(audio)}">
              </audio>
              `

              :

              `<span class="small">
                Nema audio fajla
              </span>`
            }

          </td>

          <td>
            ${escapeHtml(
              red.TELNYX_CALL_ID || ""
            )}
          </td>

          <td>
            ${escapeHtml(
              red.RAZGOVORI_ID || ""
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDatum(
                red.POCETAK_POZIVA
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDatum(
                red.KRAJ_POZIVA
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDuration(
                red.TRAJANJE_SEKUNDE
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDatum(
                red.CREATED_AT
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              formatDatum(
                red.UPDATED_AT
              )
            )}
          </td>

          <td>

            <button
              class="call-button"
              onclick="pozoviKontakt(
                ${JSON.stringify(red.ID)},
                ${JSON.stringify(red.BROJ)},
                ${JSON.stringify(red.FIRMA || "")}
              )"
              ${aktivan ? "disabled" : ""}>

              ${
                aktivan
                  ? "POZIV U TOKU..."
                  : "POZOVI"
              }

            </button>

          </td>

        </tr>
      `;
    }


    html += `

        </tbody>

      </table>
    `;


    container.innerHTML =
      html;
  }


  /* ============================================================
     POZIV KONTAKTA
     ============================================================ */

  async function pozoviKontakt(
    redId,
    broj,
    firma
  ) {

    if (!broj) {

      alert(
        "Kontakt nema broj telefona."
      );

      return;
    }


    if (aktivniPoziv) {

      alert(
        "Već postoji aktivan poziv."
      );

      return;
    }


    const potvrda =
      confirm(
        `Pozvati ${firma || broj}?\n\n${broj}`
      );

    if (!potvrda) {
      return;
    }


    const start =
      new Date();


    aktivniPoziv = {

      id: redId,

      broj: broj,

      firma: firma,

      start: start

    };


    renderTabela();


    document
      .getElementById(
        "systemStatus"
      )
      .textContent =
        `Poziv prema ${broj} je u toku...`;


    try {

      /*
         1. Prvo zapišemo početak poziva
     */

      await updatePoziv(
        redId,
        {

          POCETAK_POZIVA:
            start.toISOString(),

          KRAJ_POZIVA:
            null,

          TRAJANJE_SEKUNDE:
            null,

          STATUS:
            "POZIV U TOKU",

          VRIJEME:
            start.toISOString(),

          UPDATED_AT:
            new Date().toISOString()

        }
      );


      /*
         2. Pozivamo postojeću Edge Function
     */

      const response =
        await fetch(
          EDGE_FUNCTION_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY

            },

            body: JSON.stringify({

              to_phone:
                broj,

              client_name:
                firma

            })

          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Edge Function greška."
        );
      }


      /*
         3. Sačuvaj Telnyx Call ID
     */

      if (
        result.call_control_id
      ) {

        await updatePoziv(
          redId,
          {

            TELNYX_CALL_ID:
              result.call_control_id,

            UPDATED_AT:
              new Date().toISOString()

          }
        );
      }


      /*
         4. Pokušaj odmah pronaći
             RAZGOVORI_TELNYX
     */

      await sinhronizujRazgovor(
        redId,
        broj
      );


      /*
         5. Pokreni polling
     */

      pokreniPolling(
        redId,
        broj
      );


      /*
         6. Odmah osvježi
     */

      await ucitajPozive();

    }

    catch (error) {

      console.error(
        "Greška pri pozivu:",
        error
      );


      await updatePoziv(
        redId,
        {

          STATUS:
            "GREŠKA",

          KRAJ_POZIVA:
            new Date().toISOString(),

          UPDATED_AT:
            new Date().toISOString()

        }
      );


      aktivniPoziv = null;

      zaustaviPolling();

      await ucitajPozive();


      alert(
        "Poziv nije pokrenut:\n\n"
        + error.message
      );
    }
  }


  /* ============================================================
     UPDATE TELNYX_POZIVI
     ============================================================ */

  async function updatePoziv(
    redId,
    values
  ) {

    return await supabaseFetch(

      `/rest/v1/${TELNYX_TABLE}?ID=eq.${encodeURIComponent(redId)}`,

      {

        method: "PATCH",

        body:
          JSON.stringify(values)

      }

    );
  }


  /* ============================================================
     PRONAĐI NAJNOVIJI RAZGOVOR
     ============================================================ */

  async function pronadjiRazgovor(
    broj
  ) {

    if (!broj) {
      return null;
    }


    const url =

      `/rest/v1/${RAZGOVORI_TABLE}`

      +

      `?select=*`

      +

      `&BROJ=eq.${encodeURIComponent(broj)}`

      +

      `&order=ID.desc`

      +

      `&limit=1`;


    const data =
      await supabaseFetch(url);


    if (
      !Array.isArray(data) ||
      !data.length
    ) {

      return null;
    }


    return data[0];
  }


  /* ============================================================
     SINHRONIZACIJA RAZGOVORI_TELNYX
     ============================================================ */

  async function sinhronizujRazgovor(
    redId,
    broj
  ) {

    try {

      const razgovor =
        await pronadjiRazgovor(
          broj
        );


      if (!razgovor) {

        return null;
      }


      /*
         ID razgovora
     */

      const razgovoriId =
        pronadjiVrijednost(
          razgovor,
          [
            "ID",
            "id"
          ]
        );


      /*
         STATUS
     */

      const status =
        pronadjiVrijednost(
          razgovor,
          [
            "STATUS",
            "status",
            "CALL_STATUS",
            "call_status"
          ]
        );


      /*
         TRANSCRIPT
     */

      const transcript =
        pronadjiVrijednost(
          razgovor,
          [
            "TRANSCRIPT",
            "transcript"
          ]
        );


      /*
         AUDIO
     */

      const audioUrl =
        pronadjiVrijednost(
          razgovor,
          [

            RAZGOVORI_AUDIO_COLUMN,

            "AUDIO_URL",
            "audio_url",

            "AUDIO",
            "audio",

            "RECORDING_URL",
            "recording_url",

            "RECORDING",
            "recording"

          ]
        );


      /*
         VRIJEME razgovora
     */

      const vrijeme =
        pronadjiVrijednost(
          razgovor,
          [
            "VRIJEME",
            "vrijeme",
            "CREATED_AT",
            "created_at"
          ]
        );


      const updateData = {};


      if (
        razgovoriId !== null
      ) {

        updateData.RAZGOVORI_ID =
          Number(razgovoriId);
      }


      if (
        status !== null
      ) {

        updateData.STATUS =
          String(status);
      }


      if (
        transcript !== null
      ) {

        updateData.TRANSCRIPT =
          String(transcript)
            .toUpperCase();
      }


      if (
        audioUrl !== null
      ) {

        updateData.AUDIO_URL =
          String(audioUrl);
      }


      if (
        vrijeme !== null
      ) {

        updateData.VRIJEME =
          vrijeme;
      }


      updateData.UPDATED_AT =
        new Date().toISOString();


      if (
        Object.keys(updateData).length > 0
      ) {

        await updatePoziv(
          redId,
          updateData
        );
      }


      /*
         Ako je razgovor završen,
         izračunaj trajanje.
     */

      if (
        statusZavrsen(status)
      ) {

        await zavrsiPoziv(
          redId
        );

        return {
          ...razgovor,
          __finished: true
        };
      }


      return razgovor;

    }

    catch (error) {

      console.error(
        "Greška sinhronizacije:",
        error
      );

      return null;
    }
  }


  /* ============================================================
     POLLING
     ============================================================ */

  function pokreniPolling(
    redId,
    broj
  ) {

    zaustaviPolling();


    pollingTimer =
      setInterval(
        async () => {

          await provjeriPoziv(
            redId,
            broj
          );

        },
        5000
      );


    /*
      Prva provjera odmah
   */

    provjeriPoziv(
      redId,
      broj
    );
  }


  function zaustaviPolling() {

    if (
      pollingTimer
    ) {

      clearInterval(
        pollingTimer
      );

      pollingTimer = null;
    }
  }


  /* ============================================================
     PROVJERI POZIV
     ============================================================ */

  async function provjeriPoziv(
    redId,
    broj
  ) {

    try {

      /*
        1. Uzmi najnoviji RAZGOVORI_TELNYX
     */

      const razgovor =
        await sinhronizujRazgovor(
          redId,
          broj
        );


      /*
        2. Provjeri da li je završen
     */

      if (
        razgovor &&
        razgovor.__finished
      ) {

        return;
      }


      /*
        3. Ako nema razgovora,
           provjeri sam TELNYX_POZIVI
     */

      const red =
        await ucitajJedanPoziv(
          redId
        );


      if (!red) {
        return;
      }


      /*
        Ako je status završen
        i imamo početak,
        izračunaj kraj.
     */

      if (
        statusZavrsen(
          red.STATUS
        )
      ) {

        await zavrsiPoziv(
          redId
        );

        return;
      }


      renderTabela();


      document
        .getElementById(
          "systemStatus"
        )
        .textContent =
          `Poziv ${broj} je u toku...`;

    }

    catch (error) {

      console.error(
        "Polling greška:",
        error
      );
    }
  }


  /* ============================================================
     UČITAJ JEDAN RED
     ============================================================ */

  async function ucitajJedanPoziv(
    redId
  ) {

    const data =
      await supabaseFetch(

        `/rest/v1/${TELNYX_TABLE}?select=*&ID=eq.${encodeURIComponent(redId)}&limit=1`

      );


    if (
      !Array.isArray(data) ||
      !data.length
    ) {

      return null;
    }


    return data[0];
  }


  /* ============================================================
     ZAVRŠI POZIV
     ============================================================ */

  async function zavrsiPoziv(
    redId
  ) {

    try {

      const red =
        await ucitajJedanPoziv(
          redId
        );


      if (!red) {
        return;
      }


      let start =
        red.POCETAK_POZIVA;


      /*
        Ako nema start u bazi,
        pokušaj iz aktivnog poziva.
     */

      if (
        !start &&
        aktivniPoziv &&
        Number(aktivniPoziv.id) ===
        Number(redId)
      ) {

        start =
          aktivniPoziv.start;
      }


      const kraj =
        new Date();


      let trajanje =
        null;


      if (start) {

        const startDate =
          new Date(start);


        if (
          !isNaN(
            startDate.getTime()
          )
        ) {

          trajanje =
            Math.max(
              0,
              Math.round(
                (
                  kraj.getTime()
                  -
                  startDate.getTime()
                ) / 1000
              )
            );
        }
      }


      await updatePoziv(
        redId,
        {

          KRAJ_POZIVA:
            kraj.toISOString(),

          TRAJANJE_SEKUNDE:
            trajanje,

          UPDATED_AT:
            kraj.toISOString()

        }
      );


      zaustaviPolling();


      aktivniPoziv = null;


      document
        .getElementById(
          "systemStatus"
        )
        .textContent =
          trajanje !== null

            ?

            `Poziv završen. Trajanje: ${formatDuration(trajanje)}`

            :

            "Poziv završen.";


      await ucitajPozive();

    }

    catch (error) {

      console.error(
        "Greška završetka poziva:",
        error
      );
    }
  }


  /* ============================================================
     SLEDEĆI POZIV
     ============================================================ */

  async function sledeciPoziv() {

    /*
      NE BRIŠE NIŠTA.

      Samo prekida lokalno praćenje
      trenutnog poziva i osvježava tabelu.
   */

    zaustaviPolling();

    aktivniPoziv = null;

    await ucitajPozive();


    document
      .getElementById(
        "systemStatus"
      )
      .textContent =
        "Spreman za sljedeći poziv.";
  }


  /* ============================================================
     TRANSCRIPT
     ============================================================ */

  function otvoriTranscript(
    broj
  ) {

    if (!broj) {

      alert(
        "Broj telefona nije pronađen."
      );

      return;
    }


    window.open(

      "TRANSCRIPT.HTML?phone="
      +
      encodeURIComponent(broj),

      "_blank"

    );
  }


  /* ============================================================
     MODAL
     ============================================================ */

  function otvoriDodajKontakte() {

    document
      .getElementById(
        "contactModal"
      )
      .style.display =
        "flex";
  }


  function zatvoriDodajKontakte() {

    document
      .getElementById(
        "contactModal"
      )
      .style.display =
        "none";
  }


  /* ============================================================
     DODAJ VIŠE KONTAKATA
     ============================================================ */

  async function sacuvajKontakte() {

    const input =
      document
        .getElementById(
          "contactsInput"
        );


    const text =
      input.value.trim();


    if (!text) {

      alert(
        "Unesi barem jedan kontakt."
      );

      return;
    }


    const lines =
      text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);


    const kontakti = [];


    for (
      const line
      of lines
    ) {

      /*
        Podržava:

        FIRMA | BROJ

        ili

        FIRMA,BROJ
     */

      let parts =
        line.includes("|")
          ? line.split("|")
          : line.split(",");


      if (
        parts.length < 2
      ) {

        continue;
      }


      const firma =
        parts[0].trim();


      const broj =
        parts
          .slice(1)
          .join(",")
          .trim();


      if (!broj) {
        continue;
      }


      kontakti.push({

        FIRMA:
          firma || "NEPOZNATO",

        BROJ:
          broj,

        STATUS:
          "NIJE ZVAN",

        CREATED_AT:
          new Date().toISOString(),

        UPDATED_AT:
          new Date().toISOString()

      });
    }


    if (!kontakti.length) {

      alert(
        "Nisam pronašao ispravan format.\n\nKoristi:\nFIRMA | +15551234567"
      );

      return;
    }


    try {

      await supabaseFetch(

        `/rest/v1/${TELNYX_TABLE}`,

        {

          method: "POST",

          body:
            JSON.stringify(
              kontakti
            )

        }

      );


      input.value = "";


      zatvoriDodajKontakte();


      await ucitajPozive();


      alert(
        `Dodano kontakata: ${kontakti.length}`
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Greška pri dodavanju kontakata:\n\n"
        +
        error.message
      );
    }
  }


  /* ============================================================
     AUTOMATSKO OSVJEŽAVANJE
     ============================================================ */

  function pokreniAutoRefresh() {

    if (
      autoRefreshTimer
    ) {

      clearInterval(
        autoRefreshTimer
      );
    }


    autoRefreshTimer =
      setInterval(
        async () => {

          /*
            Dok traje aktivni poziv,
            polling vodi računa o njemu.
         */

          if (
            aktivniPoziv
          ) {

            return;
          }


          await ucitajPozive();

        },
        5000
      );
  }


  /* ============================================================
     INIT
     ============================================================ */

  document.addEventListener(
    "DOMContentLoaded",
    async () => {

      await ucitajPozive();

      pokreniAutoRefresh();

    }
  );

</script>
