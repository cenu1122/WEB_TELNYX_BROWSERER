<script>


/* ============================================================
   SUPABASE KONFIGURACIJA
   ============================================================ */


const SUPABASE_URL =
  "https://lvvidixbdtdjfwxxxqzr.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dmlkaXhiZHRkamZ3eHh4cXpyIiwicm9sZSI6IkFub24iLCJpYXQiOjE3NzU1NjgzMjgsImV4cCI6MjA5MTE0NDMyOH0.HE3-5jMrxZ7suTR0lebcfZB-9WqslwExarGoxDYMA_s";


const RAZGOVORI_TABLE =
  "RAZGOVORI_TELNYX";


/* ============================================================
   TELEFON IZ URL-a
   ============================================================ */


function dohvatiBroj() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return params.get("phone");

}


/* ============================================================
   HTML ESCAPE
   ============================================================ */


function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   SUPABASE FETCH
   ============================================================ */


async function supabaseFetch(
  path,
  options = {}
) {


  const response =
    await fetch(

      SUPABASE_URL + path,

      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }

    );


  const text =
    await response.text();


  let data = null;


  try {

    data =
      text
        ? JSON.parse(text)
        : null;

  }

  catch {

    data = text;

  }


  if (!response.ok) {

    throw new Error(

      typeof data === "object"

        ?

        (
          data.message ||
          data.error ||
          JSON.stringify(data)
        )

        :

        data

    );

  }


  return data;

}


/* ============================================================
   FORMAT DATUMA
   ============================================================ */


function formatDatum(value) {

  if (!value) {

    return "-";

  }


  const d =
    new Date(value);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return value;

  }


  return d.toLocaleString(
    "bs-BA",
    {
      dateStyle: "short",
      timeStyle: "medium"
    }
  );

}


/* ============================================================
   VALIDACIJA AUDIO URL-a
   ============================================================ */


function validAudioUrl(value) {

  if (!value) {

    return false;

  }


  try {

    const url =
      new URL(value);


    return (

      url.protocol === "https:" ||

      url.protocol === "http:"

    );

  }

  catch {

    return false;

  }

}


/* ============================================================
   PRONAĐI NAJNOVIJI RAZGOVOR
   ============================================================ */


async function pronadjiRazgovor(
  broj
) {


  const url =

    `/rest/v1/${RAZGOVORI_TABLE}`

    +

    `?select=*`

    +

    `&BROJ=eq.${encodeURIComponent(broj)}`

    +

    `&order=ID.desc`

    +

    `&limit=1`;


  const data =
    await supabaseFetch(
      url
    );


  if (

    !Array.isArray(data)

    ||

    !data.length

  ) {

    return null;

  }


  return data[0];

}


/* ============================================================
   UČITAJ TRANSCRIPT
   ============================================================ */


async function ucitajTranscript() {


  const broj =
    dohvatiBroj();


  const transcriptElement =
    document.getElementById(
      "transcript"
    );


  if (!broj) {


    transcriptElement.innerHTML =

      `<span class="error">
        Nije pronađen broj telefona u URL-u.
      </span>`;


    return;

  }


  document
    .getElementById("phone")
    .textContent =
      broj;


  transcriptElement.innerHTML =

    `<span class="loading">
      Učitavanje transkripta...
    </span>`;


  try {


    const razgovor =
      await pronadjiRazgovor(
        broj
      );


    if (!razgovor) {


      transcriptElement.innerHTML =

        `<span class="empty">
          Nije pronađen razgovor za broj:
          ${escapeHtml(broj)}
        </span>`;


      return;

    }


    /* =========================================
       ID
       ========================================= */


    const id =

      razgovor.ID ??

      razgovor.id ??

      "-";


    document
      .getElementById(
        "razgovorId"
      )
      .textContent =
        id;


    /* =========================================
       STATUS
       ========================================= */


    const status =

      razgovor.STATUS ??

      razgovor.status ??

      razgovor.CALL_STATUS ??

      razgovor.call_status ??

      "-";


    document
      .getElementById(
        "status"
      )
      .textContent =
        status;


    /* =========================================
       VRIJEME
       ========================================= */


    const vrijeme =

      razgovor.VRIJEME ??

      razgovor.vrijeme ??

      razgovor.CREATED_AT ??

      razgovor.created_at ??

      null;


    document
      .getElementById(
        "vrijeme"
      )
      .textContent =
        formatDatum(
          vrijeme
        );


    /* =========================================
       TRANSCRIPT
       ========================================= */


    const transcript =

      razgovor.TRANSCRIPT ??

      razgovor.transcript ??

      "";


    if (
      transcript
      &&
      String(transcript).trim()
    ) {


      transcriptElement.textContent =
        String(transcript);


    }

    else {


      transcriptElement.innerHTML =

        `<span class="empty">
          Transkript još nije dostupan.
        </span>`;

    }


    /* =========================================
       AUDIO
       ========================================= */


    const audioUrl =

      razgovor.AUDIO_URL ??

      razgovor.audio_url ??

      razgovor.AUDIO ??

      razgovor.audio ??

      razgovor.RECORDING_URL ??

      razgovor.recording_url ??

      razgovor.RECORDING ??

      razgovor.recording ??

      null;


    const audioBox =
      document.getElementById(
        "audioBox"
      );


    const audioPlayer =
      document.getElementById(
        "audioPlayer"
      );


    if (
      validAudioUrl(
        audioUrl
      )
    ) {


      audioPlayer.src =
        audioUrl;


      audioBox.style.display =
        "block";


    }

    else {


      audioPlayer.removeAttribute(
        "src"
      );


      audioBox.style.display =
        "none";

    }


  }

  catch (error) {


    console.error(
      "Greška:",
      error
    );


    transcriptElement.innerHTML =

      `<span class="error">

        Greška pri učitavanju transkripta:

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </span>`;

  }

}


/* ============================================================
   KOPIRAJ TRANSCRIPT
   ============================================================ */


async function kopirajTranscript() {


  const element =
    document.getElementById(
      "transcript"
    );


  const tekst =
    element.innerText.trim();


  if (
    !tekst
  ) {

    alert(
      "Nema transkripta za kopiranje."
    );

    return;

  }


  try {


    await navigator.clipboard.writeText(
      tekst
    );


    alert(
      "Transcript je kopiran."
    );


  }

  catch (error) {


    console.error(
      error
    );


    alert(
      "Nije moguće kopirati transcript."
    );

  }

}


/* ============================================================
   ZATVORI
   ============================================================ */


function zatvoriStranicu() {


  window.close();


  /* Ako browser ne dozvoli window.close(),
     vrati korisnika na prethodnu stranicu. */


  setTimeout(
    () => {

      history.back();

    },
    200
  );

}


/* ============================================================
   AUTOMATSKO OSVJEŽAVANJE
   ============================================================ */


let refreshTimer = null;


function pokreniAutoRefresh() {


  if (refreshTimer) {

    clearInterval(
      refreshTimer
    );

  }


  refreshTimer =

    setInterval(

      () => {

        ucitajTranscript();

      },

      5000

    );

}


/* ============================================================
   INIT
   ============================================================ */


document.addEventListener(

  "DOMContentLoaded",

  async () => {


    const broj =
      dohvatiBroj();


    if (broj) {

      document
        .getElementById(
          "phone"
        )
        .textContent =
          broj;

    }


    await ucitajTranscript();


    pokreniAutoRefresh();

  }

);

</script>
